x-go: &go
  image: ${GO_IMAGE:-image-service-go:local}
  build: .
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://images:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/images?sslmode=disable
    AMQP_URL: amqp://images:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
    PROCESSOR_URL: http://processor:8080
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-90}
  depends_on:
    migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    processor:
      condition: service_healthy

x-processor: &processor
  image: ${PROCESSOR_IMAGE:-image-service-processor:local}
  build:
    context: .
    dockerfile: processor/Dockerfile
  environment:
    S3_ENDPOINT: http://objectstore:8333
    S3_BUCKET: images
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    AWS_DEFAULT_REGION: us-east-1

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: images
      POSTGRES_USER: images
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U images -d images"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    hostname: image-broker
    environment:
      RABBITMQ_DEFAULT_USER: images
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - brokerdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
  objectstore:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: images
    volumes:
      - objectdata:/data
  processor:
    <<: *processor
    restart: unless-stopped
    depends_on:
      objectstore:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/readyz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *go
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *go
    command: ["api"]
    stop_grace_period: 50s
    ports:
      - "127.0.0.1:${APP_PORT:-8007}:8007"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8007/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  dispatch:
    <<: *go
    command: ["dispatch"]
  worker:
    <<: *go
    command: ["worker"]
    stop_grace_period: 35s
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
volumes:
  pgdata:
  brokerdata:
  objectdata:
  prometheusdata:
  grafanadata:
