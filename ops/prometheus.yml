global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8007]
  - job_name: dispatch
    static_configs:
      - targets: [dispatch:9091]
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
